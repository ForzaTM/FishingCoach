# Push a tag like v1.1.0 and this builds the zip and uploads it to CurseForge.
# Needs: repository secret CF_API_KEY and "## X-Curse-Project-ID: <id>" in ReelGold.toc.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
