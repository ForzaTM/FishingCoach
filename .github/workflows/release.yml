# Push a tag like v1.1.0 and this:
#   1. runs the tests,
#   2. builds the addon zip and creates a GitHub Release (BigWigs packager),
#      and uploads to CurseForge when CF_API_KEY and X-Curse-Project-ID are set,
#   3. attaches the Windows installer zip to the release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

      - uses: BigWigsMods/packager@v2

      - name: Attach Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/release.py package --version "${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" dist/*-windows-installer.zip --clobber
